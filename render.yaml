services:
  - type: web
    name: trustlens-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: backend
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://trustlens-ai.vercel.app"
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trustlens-db
          property: connectionString

databases:
  - name: trustlens-db
    plan: free
